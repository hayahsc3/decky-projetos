name: Release SaveBackupSD

# Cada alteração em save-backup-sd/ gera uma release nova com o zip instalável.
# Versão = MAJOR.MINOR do package.json + número da execução (ex.: 1.1.7).
# Para subir MAJOR/MINOR, edite "version" em save-backup-sd/package.json.
on:
  push:
    branches: [main]
    paths:
      - "save-backup-sd/**"
      - ".github/workflows/release-save-backup-sd.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-save-backup-sd
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: save-backup-sd
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Definir versão
        id: ver
        run: |
          BASE=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          VERSION="${BASE}.${GITHUB_RUN_NUMBER}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version='${VERSION}';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Build e empacotar
        run: npm run zip

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="save-backup-sd-v${VERSION}"
          FILE="SaveBackupSD-v${VERSION}.zip"
          cp SaveBackupSD.zip "$FILE"
          git log -1 --format=%B > ../notes.txt
          printf '\nInstalar: Decky → Configurações → Desenvolvedor → instalar plugin a partir de ZIP.\n' >> ../notes.txt
          gh release create "$TAG" "$FILE" \
            --title "SaveBackupSD v${VERSION}" \
            --notes-file ../notes.txt \
            --target "${{ github.sha }}"
