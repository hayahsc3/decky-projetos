name: Build SaveBackupSD beta

on:
  push:
    branches: [beta/save-backup-sd-gallery]
    paths:
      - "save-backup-sd/**"
      - ".github/workflows/build-save-backup-sd-beta.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: save-backup-sd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Build e empacotar
        run: npm run zip
      - name: Publicar beta para teste manual
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          FILE="SaveBackupSD-v${VERSION}.zip"
          cp SaveBackupSD.zip "$FILE"
          gh release create "save-backup-sd-v${VERSION}" "$FILE" \
            --title "SaveBackupSD v${VERSION} (Beta)" \
            --prerelease \
            --notes "Beta de teste: galeria de jogos com capas locais. Esta versão é inferior à versão estável e não será oferecida pelo atualizador automático. Para voltar à estável, use o atualizador do plugin."
